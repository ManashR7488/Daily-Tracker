<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FinTrack — Dashboard</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#070c17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinTrack">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { display: ['Syne','sans-serif'], body: ['"DM Sans"','sans-serif'] } } }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
  <style>
    .balance-negative { color: var(--rose) !important; }
    a { text-decoration: none; }
  </style>
</head>
<body class="font-body page-wrap">

  <!-- ── Top Header ──────────────────────────────── -->
  <header style="padding: 52px 20px 8px; position: relative;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
      <p id="greet" style="font-size:13px;color:var(--text-sub);margin:0">Good morning 👋</p>
      
      <!-- Profile Button -->
      <div id="profile-btn" style="width:34px;height:34px;border-radius:50%;background:var(--bg-raised);
                  border:1px solid var(--border);display:flex;align-items:center;
                  justify-content:center;font-size:18px;cursor:pointer;position:relative;">
        👤
        <!-- Dropdown Menu -->
        <div id="profile-dropdown" class="card" 
             style="display:none; position:absolute; top:40px; right:0; width:140px; 
                    padding:8px; z-index:100; box-shadow:0 10px 25px rgba(0,0,0,0.5);
                    border:1px solid var(--border-soft);">
          <div style="display:flex; flex-direction:column; gap:4px;">
            <a href="#" style="padding:8px 12px; font-size:13px; color:var(--text); border-radius:8px;">Profile</a>
            <a href="#" style="padding:8px 12px; font-size:13px; color:var(--text); border-radius:8px;">About</a>
            <a href="setting.html" style="padding:8px 12px; font-size:13px; color:var(--text); border-radius:8px;">Settings</a>
          </div>
        </div>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <h1 style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin:0;
                 letter-spacing:-0.01em">Your Finance Hub</h1>
      <span id="today-date" style="font-size:11px;color:var(--text-mute);
            background:var(--bg-raised);border:1px solid var(--border);
            border-radius:20px;padding:4px 12px;"></span>
    </div>
  </header>

  <main style="padding:12px 20px 0; display:flex; flex-direction:column; gap:16px;">

    <!-- ── Balance Hero Card ─────────────────────── -->
    <div class="balance-card a0">
      <p style="font-size:11px;font-weight:700;color:rgba(45,212,191,0.7);
                text-transform:uppercase;letter-spacing:.1em;margin:0 0 6px">Current Balance</p>
      <p id="bal" style="font-family:'Syne',sans-serif;font-size:42px;font-weight:800;
                          margin:0 0 20px;line-height:1.1;color:#fff">₹0</p>
      <div style="display:grid;grid-template-columns:1fr 1px 1fr;gap:0;align-items:center">
        <div>
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
            <div style="width:20px;height:20px;border-radius:50%;
                        background:var(--green-dim);display:flex;align-items:center;
                        justify-content:center;font-size:11px;color:var(--green)">↑</div>
            <span style="font-size:12px;color:var(--text-sub)">Total Income</span>
          </div>
          <p id="inc" style="font-family:'Syne',sans-serif;font-size:18px;font-weight:700;
                              margin:0;color:var(--green)">₹0</p>
        </div>
        <div style="width:1px;height:48px;background:rgba(255,255,255,0.08);margin:0 16px"></div>
        <div>
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
            <div style="width:20px;height:20px;border-radius:50%;
                        background:var(--rose-dim);display:flex;align-items:center;
                        justify-content:center;font-size:11px;color:var(--rose)">↓</div>
            <span style="font-size:12px;color:var(--text-sub)">Total Expenses</span>
          </div>
          <p id="exp" style="font-family:'Syne',sans-serif;font-size:18px;font-weight:700;
                              margin:0;color:var(--rose)">₹0</p>
        </div>
      </div>
    </div>

    <!-- ── Quick Action Cards ────────────────────── -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;" class="a1">
      <a href="income.html" class="card"
         style="display:flex;align-items:center;gap:12px;transition:border-color .2s;
                text-decoration:none;">
        <div style="width:42px;height:42px;border-radius:13px;background:var(--green-dim);
                    display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--green)"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
          </svg>
        </div>
        <div>
          <p style="font-size:14px;font-weight:600;color:var(--text);margin:0 0 1px">Add Income</p>
          <p style="font-size:11px;color:var(--text-mute);margin:0">Record earnings</p>
        </div>
      </a>
      <a href="expenses.html" class="card"
         style="display:flex;align-items:center;gap:12px;transition:border-color .2s;
                text-decoration:none;">
        <div style="width:42px;height:42px;border-radius:13px;background:var(--rose-dim);
                    display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--rose)"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <polyline points="19 12 12 19 5 12"/>
          </svg>
        </div>
        <div>
          <p style="font-size:14px;font-weight:600;color:var(--text);margin:0 0 1px">Add Expense</p>
          <p style="font-size:11px;color:var(--text-mute);margin:0">Log spending</p>
        </div>
      </a>
    </div>

    <!-- ── Total Food Summary ────────────────────── -->
    <div class="a2">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <p class="section-title" style="margin:0">Total Meals</p>
        <a href="food.html" style="font-size:12px;color:var(--teal);font-weight:500">
          Log meals →</a>
      </div>
      <div class="card" style="padding: 1rem 1.25rem;">
        <div id="food-row" style="display:flex;gap:0;"></div>
      </div>
    </div>

    <!-- ── Recent Transactions ────────────────────── -->
    <div class="a3">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <p class="section-title" style="margin:0">Recent Transactions</p>
        <a href="history.html" style="font-size:12px;color:var(--teal);font-weight:500">
          See all →</a>
      </div>
      <div class="card" id="recent-txns"></div>
    </div>

  </main>

  <!-- ── Toast ────────────────────────────────────── -->
  <div id="toast" class="toast"></div>

  <!-- ── Update Banner ────────────────────────────── -->
  <div id="update-banner">
    <p>New version available! 🎉</p>
    <button id="update-btn">Refresh</button>
  </div>

  <!-- ══════════════════════════════════════════════
       BOTTOM NAVIGATION
  ══════════════════════════════════════════════════ -->
  <nav class="bottom-nav">
    <div style="display:flex;align-items:center;justify-content:space-around;height:64px;padding:0 8px">

      <a href="index.html" class="nav-item" data-nav="index">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Home</span>
      </a>

      <a href="income.html" class="nav-item" data-nav="income">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"/>
          <polyline points="5 12 12 5 19 12"/>
          <line x1="4" y1="20" x2="20" y2="20"/>
        </svg>
        <span>Income</span>
      </a>

      <a href="expenses.html" class="nav-item" data-nav="expenses">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <polyline points="19 12 12 19 5 12"/>
          <line x1="4" y1="4" x2="20" y2="4"/>
        </svg>
        <span>Expense</span>
      </a>

      <a href="food.html" class="nav-item" data-nav="food">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8h1a4 4 0 010 8h-1"/>
          <path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/>
          <line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/>
          <line x1="14" y1="1" x2="14" y2="4"/>
        </svg>
        <span>Food</span>
      </a>

      <a href="history.html" class="nav-item" data-nav="history">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <span>History</span>
      </a>

    </div>
  </nav>

  <script src="app.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', () => {

    // ── Header ─────────────────────────────────────
    document.getElementById('greet').textContent = greeting() + ' 👋';
    document.getElementById('today-date').textContent =
      new Date().toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });

    // ── Financial Summary ──────────────────────────
    const s = DB.summary();
    document.getElementById('bal').textContent = rupees(s.balance);
    document.getElementById('inc').textContent = rupees(s.income);
    document.getElementById('exp').textContent = rupees(s.expenses);
    if (s.balance < 0) document.getElementById('bal').classList.add('balance-negative');

    // ── Total Food Row ────────────────────────────
    const log   = DB.getFoodTotal();
    const meals = [
      { key:'breakfast', label:'Breakfast', icon:'🌅' },
      { key:'lunch',     label:'Lunch',     icon:'☀️' },
      { key:'dinner',    label:'Dinner',    icon:'🌙' },
    ];
    document.getElementById('food-row').innerHTML = meals.map((m, i) => `
      ${i > 0 ? '<div style="width:1px;background:var(--border-soft);align-self:stretch;margin:0 4px"></div>' : ''}
      <div style="flex:1;text-align:center;padding:4px 8px">
        <div style="font-size:24px;margin-bottom:4px">${m.icon}</div>
        <p style="font-size:11px;color:var(--text-sub);margin:0 0 4px;font-weight:500">${m.label}</p>
        <p style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin:0;
                  color:${log[m.key] > 0 ? 'var(--amber)' : 'var(--text-mute)'}">
          ${log[m.key]}
        </p>
      </div>
    `).join('');

    // ── Recent Transactions ────────────────────────
    const txns = DB.getAll().slice(0, 5);
    const container = document.getElementById('recent-txns');
    if (txns.length === 0) {
      container.innerHTML = `
        <div style="text-align:center;padding:28px 0">
          <div style="font-size:36px;margin-bottom:8px">📊</div>
          <p style="font-size:13px;color:var(--text-mute);margin:0">No transactions yet.</p>
          <p style="font-size:12px;color:var(--text-mute);margin:4px 0 0">
            Add your first income or expense above.</p>
        </div>`;
    } else {
      container.innerHTML = txns.map(tx => txHTML(tx)).join('');
    }

    // ── Profile Dropdown Logic ─────────────────────
    const pBtn = document.getElementById('profile-btn');
    const pMenu = document.getElementById('profile-dropdown');
    
    pBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isVisible = pMenu.style.display === 'block';
      pMenu.style.display = isVisible ? 'none' : 'block';
    });

    document.addEventListener('click', () => {
      pMenu.style.display = 'none';
    });

  });
  </script>
</body>
</html>
